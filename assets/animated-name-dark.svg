<svg xmlns="http://www.w3.org/2000/svg" width="920" height="128" viewBox="0 0 920 128" role="img" aria-labelledby="title">
<title id="title">Hi, I&#x27;m Pathum Sanjaya Bandara</title>
<style>@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>

<defs>
  <linearGradient id="shine">
    <stop stop-color="#0066FF" stop-opacity="0"/>
    <stop offset=".38" stop-color="#60A5FA" stop-opacity=".7"/>
    <stop offset=".5" stop-color="#FFFFFF"/>
    <stop offset=".62" stop-color="#0066FF" stop-opacity=".85"/>
    <stop offset="1" stop-color="#0066FF" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="letters"><text x="460" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700">Hi, I'm Pathum Sanjaya Bandara</text></clipPath>
</defs>
<style>
 .line { transform-origin: center; animation: line 4s ease-in-out infinite; }
 .shimmer { animation: shimmer 4.5s ease-in-out infinite; }
 @keyframes line { 0%,100% {transform:scaleX(.65);opacity:.6} 50% {transform:scaleX(1);opacity:1} }
 @keyframes shimmer { 0%,12% {transform:translateX(0)} 72%,100% {transform:translateX(1440px)} }
</style>
<text x="460" y="23" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="5" fill="#3B82F6">IDEAS INTO WORKING SOFTWARE</text>
<text x="460" y="76" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Hi, I'm Pathum Sanjaya Bandara</text>
<g clip-path="url(#letters)"><rect class="shimmer" x="-260" y="29" width="260" height="60" fill="url(#shine)" filter="url(#glow)"/></g>
<rect class="line" x="320" y="105" width="280" height="3" rx="1.5" fill="#0066FF"/>
</svg>
